<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PADEL TRADE — Admin</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#101610;--muted:#687268;--line:#dce4da;--lime:#d9ff32;--dark:#0d281e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.brand{font-size:25px;font-weight:900}.brand span{opacity:.42}.sub{font-size:12px;color:var(--muted);margin-top:4px}.key{display:flex;gap:8px}.key input{width:280px;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn,.smallbtn{padding:12px 16px;border:0;border-radius:10px;background:var(--dark);color:white;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{font-size:30px;display:block;margin-bottom:3px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:10px;font-weight:800}.nav button.active{background:var(--dark);color:white}.panel{margin-bottom:18px}.panel h2{margin:0 0 12px}.item{border-top:1px solid #e7ece5;padding:15px 0}.meta{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.45}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf3e9;font-size:11px;font-weight:900;text-transform:uppercase}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.select{padding:9px;border:1px solid var(--line);border-radius:9px;background:white;font:inherit}.empty{color:var(--muted)}.match{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.match .select{min-width:280px}.refresh{margin-left:auto}.notice{background:#fffbea;border:1px solid #e7dfb0;border-radius:12px;padding:12px;margin-bottom:16px;color:#615b35}
@media(max-width:800px){.wrap{padding:15px}.top{display:block}.key{display:grid;grid-template-columns:1fr;margin-top:14px}.key input{width:100%}.stats{grid-template-columns:1fr 1fr}.match{display:grid}.match .select,.smallbtn{width:100%}.refresh{margin-left:0}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:1fr 1fr}.nav button{width:100%}}
</style></head>
<body><main class="wrap">
<div class="top"><div><div class="brand">PADEL <span>TRADE</span></div><div class="sub">Marketplace operations</div></div><div class="key"><input id="key" type="password" placeholder="Admin dashboard key"><button class="btn" onclick="load()">Open dashboard</button></div></div>
<div id="app"><div class="panel"><b>Protected dashboard</b><p class="empty">Enter the ADMIN_DASHBOARD_KEY configured in Vercel.</p></div></div>
</main>
<script>
let DATA=null,current='all';
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString():'';
const statuses=['new','reviewing','contacted','matched','approved','published','closed','rejected'];
const label=x=>x.company||x.name||x.company_name||'Unknown';
function statusControl(x,type){return `<div class="controls"><select class="select" id="status-${type}-${x.id}">${statuses.map(s=>`<option ${String(x.status||'new')===s?'selected':''}>${s}</option>`).join('')}</select><button class="smallbtn" onclick="saveStatus('${type}','${x.id}')">Save status</button></div>`}
function score(b,s){let n=0;if(String(b.country||'').toLowerCase()===String(s.country||'').toLowerCase())n+=50;if(b.city&&s.city&&String(b.city).toLowerCase()===String(s.city).toLowerCase())n+=20;if(b.manufacturer&&s.manufacturer&&String(s.manufacturer).toLowerCase().includes(String(b.manufacturer).toLowerCase()))n+=20;if(b.court_count&&s.court_count>=b.court_count)n+=10;return n}
function item(x,type){
 const main=type==='buyers'?`${label(x)} · ${x.country}${x.city?' · '+x.city:''} · ${x.court_count||1} courts`:type==='services'?`${x.service||x.service_type||'Service'} · ${label(x)} · ${x.country||''}${x.city?' · '+x.city:''}`:type==='suppliers'?`${label(x)} · ${x.country}${x.city?' · '+x.city:''}`:`${label(x)} · ${x.country}${x.city?' · '+x.city:''} · ${x.court_count||1} courts`;
 let match='';
 if(type==='buyers'){
  const options=[...DATA.sellers].sort((a,b)=>score(x,b)-score(x,a)).slice(0,25);
  match=`<div class="match"><select class="select" id="match-${x.id}"><option value="">Match with seller request…</option>${options.map(s=>`<option value="${esc(s.id)}">${esc(label(s))} · ${esc(s.country||'')} · ${esc(s.manufacturer||s.model||'Court')} · ${s.court_count||1} courts</option>`).join('')}</select><button class="smallbtn" onclick="matchBuyer('${x.id}')">Create match</button></div>`;
 }
 return `<div class="item"><span class="tag">${esc(x.status||'new')}</span><strong style="display:block;margin-top:8px">${esc(main)}</strong><div class="meta">${esc(label(x))} · ${esc(x.email||'')} · ${date(x.created_at)}</div><div class="meta">${esc(x.details||x.description||x.model||x.website||'')}</div>${statusControl(x,type)}${match}</div>`;
}
function section(title,items,type){return `<section class="panel"><h2>${title} <span class="tag">${items.length}</span></h2>${items.length?items.map(x=>item(x,type)).join(''):'<p class="empty">No requests yet.</p>'}</section>`}
function draw(){const d=DATA;document.getElementById('app').innerHTML=`<div class="notice">Admin actions are protected server-side. Keep the dashboard key private.</div><div class="stats"><div class="stat"><b>${d.buyers.length}</b>Buyer requests</div><div class="stat"><b>${d.sellers.length}</b>Seller submissions</div><div class="stat"><b>${d.services.length}</b>Service requests</div><div class="stat"><b>${d.suppliers.length}</b>Supplier applications</div></div><div class="nav"><button class="${current==='all'?'active':''}" onclick="current='all';draw()">All</button><button class="${current==='buyers'?'active':''}" onclick="current='buyers';draw()">Buyers</button><button class="${current==='sellers'?'active':''}" onclick="current='sellers';draw()">Sellers</button><button class="${current==='services'?'active':''}" onclick="current='services';draw()">Services</button><button class="${current==='suppliers'?'active':''}" onclick="current='suppliers';draw()">Suppliers</button><button class="refresh" onclick="load()">Refresh</button></div>${current==='all'?section('Buyer requests',d.buyers,'buyers')+section('Seller submissions',d.sellers,'sellers')+section('Service requests',d.services,'services')+section('Supplier applications',d.suppliers,'suppliers'):current==='buyers'?section('Buyer requests',d.buyers,'buyers'):current==='sellers'?section('Seller submissions',d.sellers,'sellers'):current==='services'?section('Service requests',d.services,'services'):section('Supplier applications',d.suppliers,'suppliers')}`}
async function load(){const key=document.getElementById('key').value;if(!key)return;window.ADMIN_KEY=key;document.getElementById('app').innerHTML='<div class="panel">Loading…</div>';try{const r=await fetch('/api/admin/leads',{headers:{'x-admin-key':key}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unauthorized');DATA=d;draw()}catch(e){document.getElementById('app').innerHTML=`<div class="panel"><b>Could not open dashboard</b><p class="empty">${esc(e.message)}</p></div>`}}
async function saveStatus(type,id){const status=document.getElementById(`status-${type}-${id}`).value;try{const r=await fetch('/api/admin/status',{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':window.ADMIN_KEY},body:JSON.stringify({type,id,status})});const d=await r.text();if(!r.ok)throw Error(d.slice(0,180));await load()}catch(e){alert(e.message)}}
async function matchBuyer(buyerId){const sellerId=document.getElementById('match-'+buyerId).value;if(!sellerId)return;try{const r=await fetch('/api/admin/matches',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':window.ADMIN_KEY},body:JSON.stringify({buyer_id:buyerId,seller_id:sellerId})});const d=await r.text();if(!r.ok)throw Error(d.slice(0,180));alert('Match created');await load()}catch(e){alert(e.message)}}
</script></body></html>
