<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PADEL TRADE — Admin</title><style>body{margin:0;background:#f4f6f2;color:#101410;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}.wrap{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:900;font-size:24px}.brand span{opacity:.45}.key{display:flex;gap:8px}.key input{width:260px;padding:12px;border:1px solid #ccd5ca;border-radius:8px}.btn{padding:12px 16px;border:0;border-radius:8px;background:#111;color:white;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}.stat,.panel{background:white;border:1px solid #dce3da;border-radius:14px;padding:18px}.stat b{font-size:30px;display:block}.panel{margin-bottom:20px;overflow:auto}.panel h2{margin-top:0}.item{border-top:1px solid #e5e9e3;padding:14px 0;min-width:700px}.item:first-of-type{border-top:0}.meta{color:#667066;font-size:13px;margin-top:5px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e9f2e3;font-size:12px;font-weight:700}.empty{color:#667066}@media(max-width:700px){.wrap{padding:16px}.top{display:block}.key{margin-top:14px}.key input{width:100%}.key button{width:100%}.stats{grid-template-columns:1fr}.item{min-width:0}.panel{overflow:hidden}}</style></head><body><main class="wrap"><div class="top"><div class="brand">PADEL <span>TRADE</span><div style="font-size:12px;font-weight:500;opacity:.55;margin-top:4px">Marketplace operations</div></div><div class="key"><input id="key" type="password" placeholder="Admin dashboard key"><button class="btn" onclick="load()">Open dashboard</button></div></div><div id="app"><div class="panel"><b>Protected dashboard</b><p class="empty">Enter the ADMIN_DASHBOARD_KEY configured in Vercel.</p></div></div></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Date(s).toLocaleString():'';function rows(items,type){if(!items.length)return '<p class="empty">No requests yet.</p>';return items.map(x=>{let main=type==='buyers'?`${x.country}${x.city?' · '+x.city:''} · ${x.court_count||1} courts`:type==='services'?`${x.service} · ${x.country}${x.city?' · '+x.city:''}`:`${x.company} · ${x.country}${x.city?' · '+x.city:''} · ${x.court_count||1} courts`;return `<div class="item"><span class="tag">${esc(x.status||'new')}</span><strong style="display:block;margin-top:8px">${esc(main)}</strong><div class="meta">${esc(x.name||x.email||x.company||'')} · ${esc(x.email||'')} · ${date(x.created_at)}</div><div class="meta">${esc(x.details||x.model||'')}</div></div>`}).join('')}async function load(){const key=document.getElementById('key').value;if(!key)return;document.getElementById('app').innerHTML='<div class="panel">Loading…</div>';try{const r=await fetch('/api/admin/leads',{headers:{'x-admin-key':key}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unauthorized');document.getElementById('app').innerHTML=`<div class="stats"><div class="stat"><b>${d.buyers.length}</b>Buyer requests</div><div class="stat"><b>${d.sellers.length}</b>Seller requests</div><div class="stat"><b>${d.services.length}</b>Service requests</div></div><section class="panel"><h2>Buyer requests</h2>${rows(d.buyers,'buyers')}</section><section class="panel"><h2>Seller requests</h2>${rows(d.sellers,'sellers')}</section><section class="panel"><h2>Service requests</h2>${rows(d.services,'services')}</section>`}catch(e){document.getElementById('app').innerHTML=`<div class="panel"><b>Could not open dashboard</b><p class="empty">${esc(e.message)}</p></div>`}}</script></body></html>
