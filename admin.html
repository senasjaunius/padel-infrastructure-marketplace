<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PADEL TRADE — Admin</title><style>body{margin:0;background:#f4f6f2;color:#101410;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}.wrap{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:900;font-size:24px}.brand span{opacity:.45}.key{display:flex;gap:8px}.key input{width:260px;padding:12px;border:1px solid #ccd5ca;border-radius:8px}.btn{padding:12px 16px;border:0;border-radius:8px;background:#111;color:white;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}.stat,.panel{background:white;border:1px solid #dce3da;border-radius:14px;padding:18px}.stat b{font-size:30px;display:block}.panel{margin-bottom:20px}.panel h2{margin-top:0}.item{border-top:1px solid #e5e9e3;padding:14px 0}.meta{color:#667066;font-size:13px;margin-top:5px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e9f2e3;font-size:12px;font-weight:700}.empty{color:#667066}.match{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.select{padding:9px;border:1px solid #ccd5ca;border-radius:8px;background:white}.smallbtn{padding:9px 12px;border:0;border-radius:8px;background:#111;color:white;font-weight:700}.nav{display:flex;gap:8px;margin-bottom:20px}.nav button{border:1px solid #ccd5ca;background:white;padding:10px 14px;border-radius:8px;font-weight:700}.nav button.active{background:#111;color:white}@media(max-width:700px){.wrap{padding:16px}.top{display:block}.key{margin-top:14px;display:block}.key input,.key button{width:100%;margin-bottom:8px}.stats{grid-template-columns:1fr}.match{display:grid;grid-template-columns:1fr}.select,.smallbtn{width:100%}}</style></head><body><main class="wrap"><div class="top"><div class="brand">PADEL <span>TRADE</span><div style="font-size:12px;font-weight:500;opacity:.55;margin-top:4px">Marketplace operations</div></div><div class="key"><input id="key" type="password" placeholder="Admin dashboard key"><button class="btn" onclick="load()">Open dashboard</button></div></div><div id="app"><div class="panel"><b>Protected dashboard</b><p class="empty">Enter the ADMIN_DASHBOARD_KEY configured in Vercel.</p></div></div></main><script>let DATA=null;let current='all';const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Date(s).toLocaleString():'';function item(x,type){let main=type==='buyers'?`${x.company} · ${x.country}${x.city?' · '+x.city:''} · ${x.court_count||1} courts`:type==='services'?`${x.service_type} · ${x.country||''}${x.city?' · '+x.city:''}`:`${x.company} · ${x.country}${x.city?' · '+x.city:''} · ${x.court_count||1} courts`;let options=type==='buyers'?DATA.sellers.filter(s=>String(s.country).toLowerCase()===String(x.country).toLowerCase()).slice(0,20):[];return `<div class="item"><span class="tag">${esc(x.status||'new')}</span><strong style="display:block;margin-top:8px">${esc(main)}</strong><div class="meta">${esc(x.company||'')} · ${esc(x.email||'')} · ${date(x.created_at)}</div><div class="meta">${esc(x.details||x.model||'')}</div>${type==='buyers'?`<div class="match"><select class="select" id="match-${x.id}"><option value="">Match with seller request…</option>${options.map(s=>`<option value="${esc(s.id)}">${esc(s.company)} · ${esc(s.model||'Court request')} · €${Number(s.asking_price_eur||0).toLocaleString()}</option>`).join('')}</select><button class="smallbtn" onclick="matchBuyer('${x.id}')">Create match</button></div>`:''}</div>`}function section(title,items,type){return `<section class="panel"><h2>${title} <span class="tag">${items.length}</span></h2>${items.length?items.map(x=>item(x,type)).join(''):'<p class="empty">No requests yet.</p>'}</section>`}function draw(){const d=DATA;document.getElementById('app').innerHTML=`<div class="stats"><div class="stat"><b>${d.buyers.length}</b>Buyer requests</div><div class="stat"><b>${d.sellers.length}</b>Seller requests</div><div class="stat"><b>${d.services.length}</b>Service requests</div></div><div class="nav"><button class="${current==='all'?'active':''}" onclick="current='all';draw()">All</button><button class="${current==='buyers'?'active':''}" onclick="current='buyers';draw()">Buyers</button><button class="${current==='sellers'?'active':''}" onclick="current='sellers';draw()">Sellers</button><button class="${current==='services'?'active':''}" onclick="current='services';draw()">Services</button></div>${current==='all'?section('Buyer requests',d.buyers,'buyers')+section('Seller requests',d.sellers,'sellers')+section('Service requests',d.services,'services'):current==='buyers'?section('Buyer requests',d.buyers,'buyers'):current==='sellers'?section('Seller requests',d.sellers,'sellers'):section('Service requests',d.services,'services')}`}async function load(){const key=document.getElementById('key').value;if(!key)return;window.ADMIN_KEY=key;document.getElementById('app').innerHTML='<div class="panel">Loading…</div>';try{const r=await fetch('/api/admin/leads',{headers:{'x-admin-key':key}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unauthorized');DATA=d;draw()}catch(e){document.getElementById('app').innerHTML=`<div class="panel"><b>Could not open dashboard</b><p class="empty">${esc(e.message)}</p></div>`}}async function matchBuyer(buyerId){const sellerId=document.getElementById('match-'+buyerId).value;if(!sellerId)return;try{const r=await fetch('/api/admin/matches',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':window.ADMIN_KEY},body:JSON.stringify({buyer_id:buyerId,seller_id:sellerId})});const d=await r.json();if(!r.ok)throw Error(d.error||'Match failed');alert('Match created');}catch(e){alert(e.message)}}</script></body></html>
